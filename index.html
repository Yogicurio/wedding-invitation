<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fdf2f4">
    <meta name="description" content="Celebrate the wedding of Ahalya Mattu Yogisha on December 6, 2026, and their reception on December 9, 2026.">
    <meta property="og:title" content="Ahalya Mattu Yogisha Wedding Invitation">
    <meta property="og:description" content="With the blessings of our families, join us in celebrating our wedding and reception.">
    <title>Ahalya Mattu Yogisha Wedding Invitation</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Pinyon+Script&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --rose-700:#8f3247; --rose-800:#6b1e35; --rose-900:#4f1528; --gold:#c9a255; --stone-700:#3d3937; }
        * { box-sizing:border-box; }
        html { scroll-behavior:auto; }

        /* Soft Aurora Mesh Background */
        body {
            margin:0;
            font-family:'Plus Jakarta Sans',sans-serif;
            background:#fff7f8;
            color:var(--stone-700);
            overflow-x:hidden;
            position:relative;
        }
        .aurora-canvas {
            position:fixed;
            inset:0;
            z-index:0;
            pointer-events:none;
            background:
                radial-gradient(circle at 18% 18%, rgba(244, 194, 208, 0.42), transparent 55%),
                radial-gradient(circle at 82% 24%, rgba(253, 230, 184, 0.48), transparent 58%),
                radial-gradient(circle at 76% 82%, rgba(226, 204, 245, 0.36), transparent 60%),
                radial-gradient(circle at 24% 78%, rgba(255, 214, 202, 0.42), transparent 55%);
        }

        /* Lightweight GPU Falling Petals */
        .petal-layer {
            position:fixed;
            inset:0;
            z-index:15;
            pointer-events:none;
            overflow:hidden;
        }
        .petal {
            position:absolute;
            top:-24px;
            border-radius:14px 2px 14px 2px;
            opacity:0.75;
            will-change:transform;
            animation:petalFall var(--dur, 12s) linear var(--delay, 0s) infinite;
        }
        @keyframes petalFall {
            0% {
                transform:translate3d(0, -30px, 0) rotate(0deg);
                opacity:0;
            }
            10% {
                opacity:0.75;
            }
            50% {
                transform:translate3d(var(--sway, 24px), 52vh, 0) rotate(180deg);
            }
            90% {
                opacity:0.7;
            }
            100% {
                transform:translate3d(calc(var(--sway, 24px) * -0.6), 106vh, 0) rotate(360deg);
                opacity:0;
            }
        }

        .font-script { font-family:'Pinyon Script','Great Vibes',cursive; }
        .font-serif { font-family:'Cormorant Garamond',Georgia,serif; }
        .couple-names { font-family:'Pinyon Script','Great Vibes',cursive; font-weight:400; line-height:1.15; letter-spacing:-.01em; }
        .name-mattu { display:inline-block; padding:0 .14em; color:#b88a43; font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-weight:600; font-size:.42em; letter-spacing:.03em; opacity:0; transform:translateY(10px); transition:opacity .8s ease .7s, transform .8s ease .7s; }
        .reveal, .reveal-message { opacity:0; transform:translateY(18px); transition:opacity .9s ease, transform .9s ease; }
        .reveal-delay-1 { transition-delay:.18s; }
        .reveal-delay-2 { transition-delay:.35s; }
        .reveal-delay-3 { transition-delay:.52s; }
        .reveal.is-visible, .reveal-message.is-visible { opacity:1; transform:translateY(0); }
        .couple-names.is-visible .name-mattu, .cover-shell .reveal.is-visible .name-mattu { opacity:1; transform:translateY(0); }
        .gold-divider { width:92px; height:2px; background:linear-gradient(90deg,transparent,#d5b06a,transparent); margin:1rem auto 0; opacity:0; transform:scaleX(.5); transition:opacity .8s ease .7s, transform .8s ease .7s; }
        .gold-divider.is-visible { opacity:1; transform:scaleX(1); }

        /* Smooth Reveal Without Clip-Path Seam Artifacts */
        .reveal-item {
            opacity:0;
            transform:translate3d(0, 12px, 0);
            transition:opacity .65s cubic-bezier(.22, 1, .36, 1), transform .65s cubic-bezier(.22, 1, .36, 1);
        }
        .reveal-item.is-revealed {
            opacity:1;
            transform:translate3d(0, 0, 0);
        }

        /* Smooth-Scrolling Luminous Cards */
        .glass-sheet {
            position:relative;
            background:linear-gradient(150deg, rgba(255,255,255,0.94), rgba(255,250,251,0.92));
            border:1px solid rgba(255, 255, 255, 0.95);
            box-shadow:
                0 16px 36px rgba(107,30,53,.08),
                inset 0 0 0 1px rgba(201,162,85,.34);
        }
        @media (hover: hover) and (pointer: fine) {
            .glass-sheet {
                transition:transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s ease;
                transform-style:preserve-3d;
            }
            .glass-sheet::before {
                content:"";
                position:absolute;
                inset:0;
                border-radius:inherit;
                pointer-events:none;
                background:radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 244, 214, 0.42), transparent 65%);
                opacity:0;
                transition:opacity .35s ease;
            }
            .glass-sheet:hover::before { opacity:1; }
        }

        .temple-arch {
            border-radius:170px 170px 22px 22px;
            border:1.5px solid rgba(201,162,85,.65);
            box-shadow:0 18px 42px rgba(87,19,35,.14);
        }
        .pillar-frame {
            border-radius:26px;
            border:1.5px solid rgba(201,162,85,.65);
            box-shadow:0 20px 48px rgba(87,19,35,.14);
        }

        /* Twin Temple Doors */
        .door-panel {
            position:absolute;
            top:0;
            bottom:0;
            width:50.5%;
            background:linear-gradient(160deg,rgba(255,249,242,.97) 0%,rgba(252,238,243,.96) 100%);
            transition:transform 1.15s cubic-bezier(.77,0,.175,1);
        }
        .door-left { left:0; border-right:1.5px solid rgba(201,162,85,.65); box-shadow:4px 0 24px rgba(87,19,35,.08); }
        .door-right { right:0; border-left:1.5px solid rgba(201,162,85,.65); box-shadow:-4px 0 24px rgba(87,19,35,.08); }
        .cover-shell.is-opening .door-left { transform:translateX(-102%); }
        .cover-shell.is-opening .door-right { transform:translateX(102%); }
        .cover-shell.is-opening .cover-arch-card { opacity:0; transform:scale(.96); transition:opacity .45s ease, transform .45s ease; }

        .cover-arch-card {
            background:linear-gradient(155deg, rgba(255,255,255,.96), rgba(255,248,250,.92));
            border:1.5px solid rgba(201,162,85,.65);
            border-radius:180px 180px 28px 28px;
            box-shadow:0 28px 75px rgba(87,19,35,.14), inset 0 0 24px rgba(255,243,214,.5);
            transition:opacity .45s ease, transform .45s ease;
        }

        /* Diya & Lotus Sacred Emblem */
        .sacred-emblem {
            position:relative;
            width:108px;
            height:64px;
            margin:0 auto 14px;
            border-radius:999px;
            border:1.5px solid rgba(201,162,85,.7);
            background:radial-gradient(circle at 50% 45%, #fffdf7 0%, #fff2d4 75%, #fae4b2 100%);
            box-shadow:0 8px 24px rgba(184,138,67,.22), inset 0 0 0 3px rgba(255,255,255,.85);
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
        }
        .diya-glow { display:inline-block; font-size:1.15rem; animation:diyaGlow 2.8s ease-in-out infinite; }
        .diya-glow:last-child { animation-delay:1.4s; }
        @keyframes diyaGlow {
            0%, 100% { transform:translateY(0) scale(1); filter:drop-shadow(0 0 4px rgba(234,179,8,.35)); }
            50% { transform:translateY(-1.5px) scale(1.07); filter:drop-shadow(0 0 8px rgba(245,158,11,.65)); }
        }

        /* Shimmering Primary CTA */
        .primary-btn {
            position:relative;
            overflow:hidden;
            background:linear-gradient(135deg,var(--rose-700),var(--rose-800));
            color:white;
            transition:transform .2s ease,box-shadow .2s ease;
            box-shadow:0 12px 30px rgba(107,30,53,.22);
        }
        .primary-btn::after {
            content:"";
            position:absolute;
            top:0;
            left:-100%;
            width:60%;
            height:100%;
            background:linear-gradient(90deg, transparent, rgba(255,255,255,.26), transparent);
            transform:skewX(-20deg);
            animation:btnShimmer 4.5s infinite;
        }
        @keyframes btnShimmer { 0%, 65% { left:-100%; } 100% { left:160%; } }
        .primary-btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 14px 34px rgba(107,30,53,.28); }
        .primary-btn:disabled { cursor:wait; opacity:.72; }

        .field { display:block; width:100%; min-height:48px; border:1px solid rgba(201,162,85,.42); border-radius:.9rem; background:rgba(255,255,255,.94); padding:.75rem .9rem; font-size:16px; line-height:1.4; color:#3d3937; transition:border-color .2s ease, box-shadow .2s ease; }
        textarea.field { min-height:104px; resize:vertical; }
